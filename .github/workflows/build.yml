name: Build iOS Executor dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          Dobby/build-ios
        key: ${{ runner.os }}-deps-${{ hashFiles('Makefile') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Install build tools
      run: |
        brew install cmake pkg-config || true
        mkdir -p output build external/dobby/{include,lib}

    - name: Build Dobby (static, iOS arm64)
      run: |
        set -e
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        export SDKROOT="$SDK"
        rm -rf external/dobby Dobby
        mkdir -p external/dobby/{include,lib}
        git clone --depth=1 https://github.com/jmpews/Dobby.git
        cmake -S Dobby -B Dobby/build-ios \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_SYSTEM_PROCESSOR=arm64 \
          -DCMAKE_OSX_SYSROOT="$SDK" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
          -DCMAKE_C_COMPILER="$(xcrun -f clang)" \
          -DCMAKE_CXX_COMPILER="$(xcrun -f clang++)" \
          -DCMAKE_C_FLAGS="-isysroot ${SDK} -arch arm64 -miphoneos-version-min=15.0" \
          -DCMAKE_CXX_FLAGS="-isysroot ${SDK} -arch arm64 -miphoneos-version-min=15.0" \
          -DDOBBY_BUILD_SHARED_LIBRARY=OFF \
          -DDOBBY_GENERATE_SHARED=OFF
        cmake --build Dobby/build-ios --config Release -j"$(sysctl -n hw.ncpu)"
        LIB=$(find Dobby/build-ios -name 'libdobby.a' | head -1)
        test -n "$LIB" && test -f "$LIB"
        cp "$LIB" external/dobby/lib/libdobby.a
        cp -R Dobby/include/. external/dobby/include/
        file external/dobby/lib/libdobby.a
        lipo -info external/dobby/lib/libdobby.a || true
        # Fail if still macOS platform object
        if otool -lv external/dobby/lib/libdobby.a 2>/dev/null | grep -q 'platform macOS'; then
          echo "ERROR: Dobby still built for macOS"
          exit 1
        fi
        ls -la external/dobby/lib/



    - name: Configure environment
      run: |
        export SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK=$SDK" >> $GITHUB_ENV
        echo "ARCHS=arm64" >> $GITHUB_ENV
        echo "MIN_IOS_VERSION=15.0" >> $GITHUB_ENV
        echo "USE_DOBBY=1" >> $GITHUB_ENV
        echo "ENABLE_ADVANCED_BYPASS=1" >> $GITHUB_ENV
        echo "LDFLAGS+=-L$(pwd)/external/dobby/lib -ldobby" >> $GITHUB_ENV
        echo "INCLUDES+=-I$(pwd)/external/dobby/include" >> $GITHUB_ENV

    - name: Sanity checks (structure)
      run: |
        echo "=== Project layout ==="
        ls -la
        test -d vm/src && test -d vm/include && echo "✅ vm/ present"
        test -d core && echo "✅ core/ present"
        test -d ios && echo "✅ ios/ present"
        test -d hooks && echo "✅ hooks/ present"
        test -f Makefile && echo "✅ Makefile present"
        # No Lua cheat scripts should remain
        if find . -name "*.lua" | grep -q .; then
          echo "❌ Unexpected .lua files found"
          find . -name "*.lua"
          exit 1
        else
          echo "✅ No .lua cheat scripts present"
        fi
        # No Byfron references
        if grep -ri "byfron\|Byfron\|Hyperion" --include="*.cpp" --include="*.mm" --include="*.h" --include="*.hpp" . | grep -v Binary; then
          echo "❌ Byfron references still present"
          exit 1
        else
          echo "✅ No Byfron references"
        fi

    - name: Build
      run: |
        export SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        make info
        make clean
        make -j$(sysctl -n hw.ncpu) SDK="$SDK" ARCHS=arm64 MIN_IOS_VERSION=15.0 USE_DOBBY=1
        ls -la output/

    - name: Verify artifact
      run: |
        DYLIB=output/libexecutor.dylib
        if [ ! -f "$DYLIB" ]; then
          echo "❌ $DYLIB not found"
          find . -name "*.dylib" -o -name "*.o" | head -20
          exit 1
        fi
        echo "✅ Built $DYLIB"
        file "$DYLIB"
        otool -L "$DYLIB" || true
        # Basic symbol check
        nm -gU "$DYLIB" 2>/dev/null | head -20 || true
        # Size sanity
        SIZE=$(stat -f%z "$DYLIB")
        echo "Size: $SIZE bytes"
        if [ "$SIZE" -lt 10000 ]; then
          echo "⚠️ Unusually small dylib"
        fi

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: ios-executor-dylib
        path: output/libexecutor.dylib
        if-no-files-found: error

    - name: Upload on release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: output/libexecutor.dylib
